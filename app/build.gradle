plugins {
    id 'java'
    id 'application'
}

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'gsb.journal.Main'
}

tasks.register('regenerateFixtures', JavaExec) {
    group = 'verification'
    description = 'Regenerates the committed offline case-pack fixtures from the domain builder.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'gsb.journal.cases.CasePackTool'
    args = [file('src/test/resources/fixtures/ext4-jbd2-lab').absolutePath]
}
