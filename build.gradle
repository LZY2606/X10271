plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'io.javalin:javalin:5.6.3'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'lab.ext4jbd2.Main'
}

tasks.named('run') {
    if (project.hasProperty('casepackDir')) {
        environment 'CASEPACK_DIR', project.property('casepackDir')
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.register('casepack', JavaExec) {
    group = 'casepack'
    description = 'Regenerates the offline ext4/JBD2 case pack into casepack/'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'lab.ext4jbd2.casepack.CasePackBuilder'
    args 'casepack'
}
