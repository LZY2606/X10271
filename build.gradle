plugins {
    id 'java'
    id 'application'
}

group = 'com.fslab'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'io.javalin:javalin:6.3.0'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.fslab.jbd2.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

// Regenerates the bundled offline case pack under src/main/resources/cases from source.
// Committed fixtures remain the domain deliverable; this task keeps them reproducible.
tasks.register('syncCasePack', JavaExec) {
    group = 'application'
    description = 'Regenerate the bundled ext4/JBD2 offline case pack into cases/ and resources.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.fslab.jbd2.casepack.CasePackGenerator'
}
