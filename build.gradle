subprojects {
    apply plugin: 'java'
    repositories {
        mavenCentral()
    }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(17) }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging { events 'passed', 'skipped', 'failed' }
    }
}
